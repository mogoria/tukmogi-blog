name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned deliberately: the theme is tested against this version.
          # Bump it and the DoIt submodule together.
          hugo-version: '0.166.0'
          extended: true  # DoIt compiles SCSS and requires the extended build

      - name: Build
        run: hugo --minify

      # Pull requests build above as a check, but only pushes to main publish.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: mogoria/mogoria.github.io
          publish_branch: master
          # false so the published site is exactly what `hugo` built - with
          # `keep_files: true` anything deleted here lingered in the target repo
          # forever. Set this back to true if a custom domain (CNAME) is added.
          keep_files: false
