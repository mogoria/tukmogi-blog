baseURL = "https://mogoria.github.io"
# [en, zh-cn, fr, ...] determines default content language
defaultContentLanguage = "en"
# language code
locale = "en"
title = "tukmogi blog"

# Change the default theme to be use when building the site with Hugo
theme = "DoIt"

[params]
  # site description - used for <meta name="description">, og:description and
  # twitter:description. Without it, link previews show a bare title.
  description = "Writeups and notes on offensive security: HackTheBox machines, CTF challenges and web exploitation."
  # site keywords
  keywords = ["security", "ctf", "hackthebox", "writeups", "infosec", "web exploitation"]
  [params.home.profile]
    enable = true
    # Gravatar Email for preferred avatar in home page
    gravatarEmail = ""
    # URL of avatar shown in home page
    avatarURL = "/images/me/avatar.png"
    # title shown in home page (HTML format is supported)
    title = "tukmogi"
    # subtitle shown in home page
    subtitle = "Breaking boxes and writing it down."
    # whether to use typeit animation for subtitle
    typeit = true
    # whether to show social links
    social = true 
  [params.home.posts]
    enable = true
    paginate = 7 
[params.header]
    # desktop header mode ("fixed", "normal", "auto")
    desktopMode = "fixed"
    # mobile header mode ("fixed", "normal", "auto")
    mobileMode = "auto"
    # DoIt NEW | 0.2.11 Theme change mode
    # theme change mode ("switch", "select")
    themeChangeMode = "select"
    # DoIt NEW | 0.2.0 Header title config
    [params.header.title]
      # URL of the LOGO
      logo = ""
      # title name
      name = "tukmogi"
      # you can add extra information before the name (HTML format is supported), such as icons
      pre = ""
      # you can add extra information after the name (HTML format is supported), such as icons
      post = ""
      # DoIt NEW | 0.2.5 whether to use typeit animation for title name
      typeit = true  
  [params.page]
    [params.page.toc]
      # whether to enable the table of the contents
      enable = true
      # DoIt NEW | 0.2.9 whether to keep the static table of the contents in front of the post
      keepStatic = false
      # whether to make the table of the contents in the sidebar automatically collapsed
      auto = true
    [params.page.code]
      # whether to show the copy button of the code block
      copy = true
      # the maximum number of lines of displayed code by default
      maxShownLines = 20
  [params.social]
    GitHub = "mogoria"
    Twitter = "tukmen_mogoria"


[menu]
  [[menu.main]]
    identifier = "posts"
    # you can add extra information before the name (HTML format is supported), such as icons
    pre = ""
    # you can add extra information after the name (HTML format is supported), such as icons
    post = ""
    name = "Posts"
    url = "/posts/"
    # title will be shown when you hover on this menu link
    title = ""
    weight = 1
  [[menu.main]]
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
    weight = 2
  [[menu.main]]
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""
    weight = 3
  [[menu.main]]
    identifier = "about"
    pre = ""
    post = ""
    name = "About"
    url = "/about/"
    title = ""
    weight = 4

# Markup related configuration in Hugo
[markup]
  # Syntax Highlighting (https://gohugo.io/content-management/syntax-highlighting)
  [markup.highlight]
    # false is a necessary configuration (https://github.com/dillonzq/LoveIt/issues/158)
    noClasses = false


# Author info, used for post bylines and structured data
[author]
  name = "tukmogi"
  link = "https://github.com/mogoria"

# Site search. "fuse" is fully client-side and needs no external service or
# API key - it just reads the JSON index emitted by the [outputs] block below.
[params.search]
  enable = true
  type = "fuse"
  contentLength = 4000
  placeholder = "Search posts"
  maxResultLength = 10
  snippetLength = 30
  highlightTag = "em"
  absoluteURL = false
  [params.search.fuse]
    isCaseSensitive = false
    minMatchCharLength = 2
    findAllMatches = false
    location = 0
    threshold = 0.3
    distance = 100
    ignoreLocation = false
    ignoreFieldNorm = false

# The JSON output is what feeds the search index above.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
